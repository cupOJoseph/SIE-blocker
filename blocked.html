<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study first — SIE Study Blocker</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="desk">
    <header class="desk-head">
      <p class="desk-kicker">Route intercepted</p>
      <h1 class="desk-title">Study instead</h1>
      <p class="desk-sub" id="progressLine">This site is blocked. Run as many SIE cards as you like, then get back to work.</p>
    </header>

    <section class="card" id="card" aria-live="polite">
      <div class="card-topline">
        <span class="card-section" id="qSection">—</span>
        <span class="card-number" id="qNumber">Card —</span>
      </div>

      <p class="card-question" id="qText">Loading question…</p>

      <div class="card-answers" id="answerArea"></div>

      <div class="card-feedback" id="feedback" hidden>
        <p class="feedback-verdict" id="verdict"></p>
        <p class="feedback-explain"><span class="explain-label">Why</span><span id="explain"></span></p>
      </div>

      <div class="card-actions">
        <button class="btn btn-primary" id="submitBtn" type="button">Check answer</button>
        <button class="btn btn-ghost" id="nextBtn" type="button" hidden>Next card</button>
        <span class="kbd-hint" id="kbdHint" hidden>Enter or Space &rarr; next card</span>
      </div>
    </section>

    <footer class="desk-foot">
      <div class="stat"><span class="stat-label">Session</span><span class="stat-value" id="sessionStat">0 / 0</span></div>
      <div class="stat"><span class="stat-label">Streak</span><span class="stat-value" id="streakStat">0</span></div>
      <div class="stat"><span class="stat-label">All-time</span><span class="stat-value" id="allTimeStat">0%</span></div>
      <a class="foot-link" href="#" id="optionsLink">Settings</a>
    </footer>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
